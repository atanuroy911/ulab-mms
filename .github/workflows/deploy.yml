name: Deploy to Netlify and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy-release:
    runs-on: ubuntu-latest
    environment: deploy
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no release]')"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      # This runs the Next.js build natively on the GitHub Actions runner,
      # completely bypassing Netlify's build servers, and pushes the compiled
      # application (including serverless functions) directly to Netlify production.
      - name: Build and Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          # Add any other environment variables your Next.js build requires:
          # MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: netlify deploy --build --prod

      # Use semantic-release to automatically determine the version,
      # create a git tag, and generate a GitHub release based on commit messages.
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
