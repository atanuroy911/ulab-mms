name: Deploy to Netlify and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-deploy-release:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: write
    if: "github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[no release]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      # Run a dry-run of semantic-release to determine what the next version WILL be
      - name: Semantic Release (Dry Run)
        id: semantic_dry
        uses: cycjimmy/semantic-release-action@v4
        with:
          dry_run: true
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # This runs the Next.js build natively on the GitHub Actions runner,
      # completely bypassing Netlify's build servers, and pushes the compiled
      # application (including serverless functions) directly to Netlify production.
      - name: Build and Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          NEXT_PUBLIC_APP_VERSION: ${{ steps.semantic_dry.outputs.new_release_version }}
          # Add any other environment variables your Next.js build requires:
          # MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: netlify deploy --build --prod

      # Use semantic-release to automatically determine the version,
      # bump package.json, create a git tag/GitHub release, and commit the
      # version bump + changelog back to main.
      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
